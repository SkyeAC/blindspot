async function buildModelURL(spec) {
  const scene = new THREE.Scene();
  const mat = (c, m, r, name) => { const M = new THREE.MeshStandardMaterial({ color: new THREE.Color(c), metalness: m, roughness: r }); M.name = name; return M; };
  for (const p of spec.parts) {
    const shapes = p.s.map(s => {
      const sh = new THREE.Shape(s.o.map(([x, y]) => new THREE.Vector2(x, y)));
      for (const h of s.h) sh.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x, y))));
      return sh;
    });
    const geo = new THREE.ExtrudeGeometry(shapes, { depth: p.d, bevelEnabled: p.b > 0, bevelThickness: p.b, bevelSize: p.b, bevelSegments: 2, curveSegments: 3 });
    const mesh = new THREE.Mesh(geo, mat(p.c, p.m, p.r, p.n)); mesh.name = p.n; mesh.position.set(p.p[0], p.p[1], p.p[2]); scene.add(mesh);
  }
  for (const q of spec.prims) {
    const geo = q.t === 'cyl' ? new THREE.CylinderGeometry(q.rad, q.rad, q.h, 32) : new THREE.BoxGeometry(q.e[0], q.e[1], q.e[2]);
    const mesh = new THREE.Mesh(geo, mat(q.c, q.m, q.r, q.n)); mesh.name = q.n; mesh.position.set(q.p[0], q.p[1], q.p[2]); scene.add(mesh);
  }
  const buf = await new GLTFExporter().parseAsync(scene, { binary: true });
  return URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
}
